spring.application.name=usage-service
server.port=8084

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=usage-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.meichel.kafka_event

# influxdb
influxdb.token=api_key
influxdb.host=http://localhost:8181
influxdb.database=energy-tracker