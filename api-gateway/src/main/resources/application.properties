spring.application.name=api-gateway
server.port=9000

# Actuator
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers

#Resilinece4j Properties
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=8
resilience4j.circuitbreaker.configs.default.failureRateThreshold=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

#Keycloak
keycloak.issuer-uri=http://localhost:8091/realms/home-energy-tracker
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.issuer-uri}
logging.level.org.springframework.security=DEBUG

#Security
security.excluded.urls= /, /actuator/**, /error, /swagger-ui.html, /swagger-ui/**, /docs/**, /v3/api-docs/**, /swagger-resources/**, /api-docs/**, /api/v1/ingestion/**


#Service URLs
user.service.base.url=http://localhost:8081
device.service.base.url=http://localhost:8082
ingestion.service.base.url=http://localhost:8083
usage.service.base.url=http://localhost:8084
insight.service.base.url=http://localhost:8086

#OpenAPI
springdoc.swagger-ui.path=/
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/docs/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Device Service
springdoc.swagger-ui.urls[1].url=/docs/device-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Ingestion Service
springdoc.swagger-ui.urls[2].url=/docs/ingestion-service/v3/api-docs

springdoc.swagger-ui.urls[3].name=Usage Service
springdoc.swagger-ui.urls[3].url=/docs/usage-service/v3/api-docs

springdoc.swagger-ui.urls[4].name=Insight Service
springdoc.swagger-ui.urls[4].url=/docs/insight-service/v3/api-docs

springdoc.show-oauth2-endpoints=true
springdoc.oAuthFlow.authorizationUrl=${keycloak.issuer-uri}/protocol/openid-connect/auth
springdoc.oAuthFlow.tokenUrl=${keycloak.issuer-uri}/protocol/openid-connect/token
springdoc.swagger-ui.oauth.client-id=home-energy-tracker-browser
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid
