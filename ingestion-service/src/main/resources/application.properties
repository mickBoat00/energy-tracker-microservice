spring.application.name=ingestion-service
server.port=8083

#Kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.template.default-topic=energy-consumption
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Data simulation
request.per.interval=10
ingestion.service.base.url=http://localhost:8083
schedule.interval.perSeconds=60

#OpenAPI
springdoc.swagger-ui.enabled=false
openapi.server.url=http://localhost:9000
openapi.security.authorization-url=http://localhost:8091/realms/home-energy-tracker/protocol/openid-connect/auth
openapi.security.token-url=http://localhost:8091/realms/home-energy-tracker/protocol/openid-connect/token

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
